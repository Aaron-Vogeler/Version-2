name = "telnyx-webhook"
main = "src/index.ts"
compatibility_date = "2025-11-08" # match dashboard date, safe

# =========================
# Plaintext runtime vars
# =========================
[vars]
FROM_NUMBER = "+12062079439"
MONITOR_NUMBER = "+12767735173"
CALL_CONTROL_APP_ID = "2824172743010813129"
SUPABASE_URL = "https://somhqsewvkwobgvrocyb.supabase.co"
DEFAULT_USER_ID = "3f5c8773-6343-4579-a77b-7dd7f57799b9"

# Optional / not used by Option-1 monitor approach, ok to leave
STREAMING_WS_URL = "wss://telnyx-webhook.aaronmvogeler.workers.dev/telnyx-stream"
MAKE_WEBHOOK_URL = "https://hook.us1.make.com/6jtqrgjmw1q1aolmnfeiqaxx86x1il7o"
ASSISTANT_ID = "assistant-4ea9739c-9823-4100-9f38-ec3a8f17be9f"

# =========================
# Production environment
# =========================
[env.production]
name = "telnyx-webhook"

# Remove placeholder routes unless you REALLY use a custom domain
# routes = [
#   { pattern = "yourdomain.com/telnyx/webhook", zone_name = "yourdomain.com" }
# ]

# If you want prod-specific overrides, put them here:
# [env.production.vars]
# MONITOR_NUMBER = "+12767735173"

# =========================
# Queues / KV / Triggers
# (only keep if your code uses them)
# =========================
[[queues.producers]]
queue = "telnyx-events-queue"
binding = "TELNYX_EVENTS"

[[queues.consumers]]
queue = "telnyx-events-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "telnyx-events-dlq"

[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "IDEMPOTENCY"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"
