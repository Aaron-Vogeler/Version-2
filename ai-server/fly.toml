app = "version-2"
primary_region = "ash"

[build]
  dockerfile = "Dockerfile"
  dockerfile_entrypoint = "/app"

[[services]]
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"

[env]
  NODE_ENV = "production"

[processes]
  app = "npm run start"

[[machines]]
  name = "app"
  processes = ["app"]
  size = "shared-cpu-1x"
  auto_start = true
  auto_stop = true
